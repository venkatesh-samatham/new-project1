apiVersion: apps/v1
kind: Deployment
metadata:
  name: education-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: education-app
  template:
    metadata:
      labels:
        app: education-app
    spec:
      containers:
      - name: education-app
        image: rajuprudhvi/education_shop:605dce1fe67335cff863099f4c63e5a9121f1917
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: education-service
spec:
  type: NodePort
  selector:
    app: education-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30030
